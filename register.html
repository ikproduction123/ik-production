<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Buat akun IK-Pro.My.Id dan mulai membuat undangan digital elegan."
    >

    <title>Daftar - IK-Pro.My.Id</title>

    <!-- Favicon -->
    <link
        rel="icon"
        href="/favicon.ico"
    >

    <!-- Auth CSS -->
    <link
        rel="stylesheet"
        href="/assets/css/auth.css"
    >

    <!-- Supabase JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
        defer
    ></script>

</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <!-- =========================================
                 BRAND
            ========================================== -->

            <div class="auth-brand">

                <a
                    href="/"
                    class="auth-logo"
                >
                    IK-Pro<span>.My.Id</span>
                </a>

                <p class="auth-tagline">
                    Undangan Digital Elegan Dalam Sekejap
                </p>

            </div>


            <!-- =========================================
                 HEADER
            ========================================== -->

            <div class="auth-header">

                <h1>
                    Buat Akun
                </h1>

                <p>
                    Daftar sekarang dan mulai membuat
                    undangan digital Anda.
                </p>

            </div>


            <!-- =========================================
                 ALERT
            ========================================== -->

            <div
                id="auth-alert"
                class="auth-alert"
                role="alert"
                aria-live="polite"
                hidden
            ></div>


            <!-- =========================================
                 REGISTER FORM
            ========================================== -->

            <form
                id="register-form"
                class="auth-form"
                novalidate
            >

                <!-- Nama -->
                <div class="form-group">

                    <label for="name">
                        Nama Lengkap
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Nama lengkap"
                        autocomplete="name"
                        maxlength="100"
                        required
                    >

                    <small
                        id="name-error"
                        class="form-error"
                    ></small>

                </div>


                <!-- Nomor Telepon -->
                <div class="form-group">

                    <label for="phone">
                        Nomor WhatsApp
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="08xxxxxxxxxx"
                        autocomplete="tel"
                        maxlength="20"
                        inputmode="tel"
                        required
                    >

                    <small
                        id="phone-error"
                        class="form-error"
                    ></small>

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="nama@email.com"
                        autocomplete="email"
                        maxlength="254"
                        required
                    >

                    <small
                        id="email-error"
                        class="form-error"
                    ></small>

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Minimal 8 karakter"
                            autocomplete="new-password"
                            minlength="8"
                            maxlength="72"
                            required
                        >

                        <button
                            type="button"
                            id="toggle-password"
                            class="password-toggle"
                            aria-label="Tampilkan password"
                            aria-pressed="false"
                        >
                            👁
                        </button>

                    </div>

                    <small
                        id="password-error"
                        class="form-error"
                    ></small>

                </div>


                <!-- Konfirmasi Password -->
                <div class="form-group">

                    <label for="confirm-password">
                        Konfirmasi Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm-password"
                            placeholder="Ulangi password"
                            autocomplete="new-password"
                            minlength="8"
                            maxlength="72"
                            required
                        >

                        <button
                            type="button"
                            id="toggle-confirm-password"
                            class="password-toggle"
                            aria-label="Tampilkan konfirmasi password"
                            aria-pressed="false"
                        >
                            👁
                        </button>

                    </div>

                    <small
                        id="confirm-password-error"
                        class="form-error"
                    ></small>

                </div>


                <!-- Terms -->
                <div class="auth-terms">

                    <label>

                        <input
                            type="checkbox"
                            id="terms"
                            name="terms"
                            required
                        >

                        <span>
                            Saya menyetujui
                            <a href="/terms.html">
                                Syarat & Ketentuan
                            </a>
                            dan
                            <a href="/privacy.html">
                                Kebijakan Privasi
                            </a>.
                        </span>

                    </label>

                    <small
                        id="terms-error"
                        class="form-error"
                    ></small>

                </div>


                <!-- Submit -->
                <button
                    type="submit"
                    id="register-submit"
                    class="auth-submit"
                >

                    <span id="register-submit-text">
                        Buat Akun
                    </span>

                    <span
                        id="register-loading"
                        class="auth-loading"
                        hidden
                    >
                        Membuat akun...
                    </span>

                </button>

            </form>


            <!-- =========================================
                 FOOTER
            ========================================== -->

            <div class="auth-footer">

                <p>
                    Sudah punya akun?

                    <a href="/login.html">
                        Masuk
                    </a>
                </p>

            </div>

        </section>

    </main>


    <!-- Register JS -->
    <script
        type="module"
        src="/assets/js/register.js"
    ></script>

</body>
</html>
