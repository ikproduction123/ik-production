<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Daftar akun IK Production untuk membuat undangan digital."
        />
        <title>Daftar Akun — IK Production</title>
        <link rel="stylesheet" href="../assets/css/auth.css" />
        <script type="module" src="/assets/js/register.js"></script>
    </head>
    <body>
        <main class="auth-container">
            <section class="auth-card">
                <a class="auth-brand" href="/">
                    <img src="/assets/images/logo.webp" alt="IK Production" />
                    <span>IK Production</span>
                </a>

                <h1>Buat Akun</h1>
                <p class="auth-description">
                    Daftar untuk mulai membuat undangan digital Anda.
                </p>

                <div
                    id="formMessage"
                    class="form-message"
                    role="status"
                    aria-live="polite"
                    hidden
                ></div>

                <form id="registerForm">
                    <label for="fullName">Nama lengkap</label>
                    <input
                        id="fullName"
                        name="fullName"
                        type="text"
                        autocomplete="name"
                        minlength="2"
                        maxlength="100"
                        required
                        placeholder="Masukkan nama lengkap"
                    />

                    <label for="email">Email</label>
                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        maxlength="254"
                        required
                        placeholder="nama@email.com"
                    />

                    <label for="phone">Nomor WhatsApp (opsional)</label>
                    <input
                        id="phone"
                        name="phone"
                        type="tel"
                        autocomplete="tel"
                        maxlength="25"
                        placeholder="08xxxxxxxxxx"
                    />

                    <label for="password">Password</label>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                        placeholder="Minimal 8 karakter"
                    />

                    <label for="confirmPassword">Konfirmasi password</label>
                    <input
                        id="confirmPassword"
                        name="confirmPassword"
                        type="password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                        placeholder="Ulangi password"
                    />

                    <button id="registerButton" type="submit">
                        Daftar Sekarang
                    </button>
                </form>

                <p class="auth-switch">
                    Sudah punya akun?
                    <a href="/login/">Masuk</a>
                </p>

                <a class="back-home" href="/">← Kembali ke beranda</a>
            </section>
        </main>
    </body>
</html>
