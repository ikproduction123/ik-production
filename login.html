<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - IK Production Undangan Digital</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Masuk ke IK-Pro</h2>
      <p>Kelola undangan digital Anda dengan mudah</p>
    </div>
    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="nama@email.com" required>
      </div>
      <div class="form-group">
        <label for="password">Kata Sandi</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <div class="form-options">
        <label><input type="checkbox" id="remember-me"> Ingat saya</label>
        <a href="/forgot-password.html" class="auth-link">Lupa kata sandi?</a>
      </div>
      <button type="submit" class="btn-primary btn-full" id="btn-login">Masuk</button>
    </form>
    <p class="auth-footer">
      Belum punya akun? <a href="/register.html" class="auth-link">Daftar sekarang</a>
    </p>
  </div>
  <script type="module" src="/js/auth/login.js"></script>
</body>
</html>
