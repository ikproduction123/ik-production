<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Masuk ke akun IK-Pro.My.Id untuk mengelola undangan digital Anda."
    >

    <title>Masuk - IK-Pro.My.Id</title>

    <!-- Favicon -->
    <link
        rel="icon"
        href="/favicon.ico"
    >

    <!-- Auth CSS -->
    <link
        rel="stylesheet"
        href="/assets/css/auth.css"
    >

    <!-- Supabase JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
        defer
    ></script>
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <!-- Brand -->
            <div class="auth-brand">

                <a
                    href="/"
                    class="auth-logo"
                >
                    IK-Pro<span>.My.Id</span>
                </a>

                <p class="auth-tagline">
                    Undangan Digital Elegan Dalam Sekejap
                </p>

            </div>


            <!-- Header -->
            <div class="auth-header">

                <h1>
                    Selamat Datang Kembali
                </h1>

                <p>
                    Masuk ke akun Anda untuk mengelola
                    undangan digital.
                </p>

            </div>


            <!-- Alert -->
            <div
                id="auth-alert"
                class="auth-alert"
                role="alert"
                aria-live="polite"
                hidden
            ></div>


            <!-- Login Form -->
            <form
                id="login-form"
                class="auth-form"
                novalidate
            >

                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="nama@email.com"
                        autocomplete="email"
                        required
                    >

                    <small
                        id="email-error"
                        class="form-error"
                    ></small>

                </div>


                <!-- Password -->
                <div class="form-group">

                    <div class="form-label-row">

                        <label for="password">
                            Password
                        </label>

                        <a
                            href="/forgot-password.html"
                            class="forgot-password"
                        >
                            Lupa password?
                        </a>

                    </div>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Masukkan password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="toggle-password"
                            class="password-toggle"
                            aria-label="Tampilkan password"
                            aria-pressed="false"
                        >
                            👁
                        </button>

                    </div>

                    <small
                        id="password-error"
                        class="form-error"
                    ></small>

                </div>


                <!-- Submit -->
                <button
                    type="submit"
                    id="login-submit"
                    class="auth-submit"
                >
                    <span id="login-submit-text">
                        Masuk
                    </span>

                    <span
                        id="login-loading"
                        class="auth-loading"
                        hidden
                    >
                        Memproses...
                    </span>
                </button>

            </form>


            <!-- Register -->
            <div class="auth-footer">

                <p>
                    Belum punya akun?
                    <a href="/register.html">
                        Daftar Sekarang
                    </a>
                </p>

            </div>

        </section>

    </main>


    <!-- Supabase client + Auth -->
    <script
        type="module"
        src="/assets/js/auth.js"
    ></script>

</body>
</html>
