<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - IK-Pro.My.Id</title>

    <link rel="stylesheet" href="assets/css/auth.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>Masuk</h1>

            <p class="subtitle">
                Selamat datang kembali
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label>Email</label>
                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="email@gmail.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="********"
                            required
                        >
                        <button
                            type="button"
                            class="toggle-password"
                        >
                            👁
                        </button>
                    </div>
                </div>

                <button
                    type="submit"
                    class="btn-primary"
                >
                    Masuk
                </button>

            </form>

            <p class="auth-link">
                Belum punya akun?
                <a href="register.html">
                    Daftar
                </a>
            </p>

        </div>

    </div>

    <script src="assets/js/auth.js"></script>

</body>
</html>
