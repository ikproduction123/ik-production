<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Daftar — IK-Pro.My.Id</title>

    <link
        rel="stylesheet"
        href="/assets/css/auth.css"
    >
</head>

<body>

    <main class="auth-page">

        <div class="auth-container">

            <div class="auth-logo">
                <a href="/">
                    IK-Pro<span>.My.Id</span>
                </a>
            </div>

            <section class="auth-card">

                <h1>
                    Buat Akun
                </h1>

                <p class="auth-subtitle">
                    Mulai membuat undangan digital
                    bersama IK-Pro.My.Id
                </p>

                <div
                    id="formMessage"
                    class="form-message"
                ></div>

                <form id="registerForm">

                    <div class="form-group">

                        <label for="name">
                            Nama Lengkap
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Nama lengkap"
                            autocomplete="name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="phone">
                            Nomor WhatsApp
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="08xxxxxxxxxx"
                            autocomplete="tel"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="nama@email.com"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Minimal 6 karakter"
                                autocomplete="new-password"
                                minlength="6"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-target="password"
                            >
                                Lihat
                            </button>

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="confirmPassword">
                            Konfirmasi Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Ulangi password"
                                autocomplete="new-password"
                                minlength="6"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-target="confirmPassword"
                            >
                                Lihat
                            </button>

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="auth-button"
                        id="registerButton"
                    >
                        Daftar
                    </button>

                </form>


                <div class="auth-footer">

                    Sudah punya akun?

                    <a href="/login.html">
                        Masuk
                    </a>

                </div>

            </section>


            <a
                href="/"
                class="back-home"
            >
                ← Kembali ke Beranda
            </a>

        </div>

    </main>


    <script src="/assets/js/auth.js"></script>

</body>

</html>
