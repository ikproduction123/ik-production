<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Masuk — IK-Pro.My.Id</title>

    <link
        rel="stylesheet"
        href="/assets/css/auth.css"
    >
</head>

<body>

    <main class="auth-page">

        <div class="auth-container">

            <div class="auth-logo">
                <a href="/">
                    IK-Pro<span>.My.Id</span>
                </a>
            </div>

            <section class="auth-card">

                <h1>
                    Selamat Datang
                </h1>

                <p class="auth-subtitle">
                    Masuk ke dashboard IK-Pro.My.Id
                </p>

                <div
                    id="formMessage"
                    class="form-message"
                ></div>

                <form id="loginForm">

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="nama@email.com"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Masukkan password"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-target="password"
                            >
                                Lihat
                            </button>

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="auth-button"
                        id="loginButton"
                    >
                        Masuk
                    </button>

                </form>


                <div class="auth-footer">

                    Belum punya akun?

                    <a href="/register.html">
                        Daftar sekarang
                    </a>

                </div>

            </section>


            <a
                href="/"
                class="back-home"
            >
                ← Kembali ke Beranda
            </a>

        </div>

    </main>


    <script src="/assets/js/auth.js"></script>

</body>

</html>
