
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Undangan Pernikahan</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="wedding">
    <section class="cover">
      <p THEME="label">THE WEDDING OF</p>
      <h1 id="coupleNames">Anisa &amp; Bagas</h1>
      <p id="eventDate">Tanggal acara</p>
      <p id="guestName"></p>
      <button id="openInvitation">Buka Undangan</button>
    </section>

    <section id="invitationContent" hidden>
      <h2>Assalamu'alaikum Warahmatullahi Wabarakatuh</h2>

        Dengan penuh kebahagiaan, kami mengundang Anda.
      </p>
      <h2 id="venueName">Tempat Acara</h2>
      <p id="venueAddress"></p>
      <a id="mapsLink" hidden target="_blank"
         rel="noopener noreferrer">Lihat Lokasi</a>
    </section>
  </main>

  <script type="module" src="./script.js"></script>

</html>
