
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Dashboard Admin — IK Production</title>
</head>
<body>
  <main>
    <h1>Dashboard Admin</h1>
    <p id="welcomeMessage">Memeriksa hak akses...</p>

    <section>
      <h2>Manajemen SaaS</h2>
      <ul>
        <li>Data pelanggan</li>
        <li>Paket dan harga</li>
        <li>Katalog tema</li>
        <li>Konfirmasi pembayaran</li>
        <li>Langganan pelanggan</li>
      </ul>
      <p>Fitur manajemen akan kita implementasikan bertahap.</p>
    </section>

    <button id="logoutButton" type="button">Keluar</button>
  </main>

  <script type="module">
    import { requireRole, setupLogout } from "/assets/js/auth-guard.js";

    setupLogout();

    const result = await requireRole(["admin"]);

    if (result) {
      const name = result.profile.full_name || result.user.email || "Admin";
      document.getElementById("welcomeMessage").textContent =
        `Selamat datang, ${name}!`;
    }
  </script>
</body>
</html>
