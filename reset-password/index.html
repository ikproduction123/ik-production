
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buat Password Baru — IK Production</title>
  <link rel="stylesheet" href="/assets/css/auth.css">
  <script type="module" src="/assets/js/reset-password.js"></script>
</head>
<body>
  <main class="auth-container">
    <section class="auth-card">
      <a class="auth-brand" href="/">
        <img src="/assets/images/logo.webp" alt="Logo IK Production">
        <span>IK Production</span>
      </a>

      <h1>Password Baru</h1>
      <p class="auth-description">
        Buat password baru untuk akun IK Production Anda.
      </p>

      <div id="formMessage" class="form-message"
           role="status" aria-live="polite" hidden></div>

      <form id="resetForm" hidden>
        <label for="password">Password baru</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
          placeholder="Minimal 8 karakter"
        >

        <label for="confirmPassword">Konfirmasi password baru</label>
        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
          placeholder="Ulangi password baru"
        >

        <button id="resetButton" type="submit">
          Simpan Password Baru
        </button>
      </form>

      <a class="back-home" href="/login/">Kembali ke Login</a>
    </section>
  </main>
</body>
</html>
