
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Dashboard Pelanggan — IK Production</title>
</head>
<body>
  <main>
    <h1>Dashboard Pelanggan</h1>
    <p id="welcomeMessage">Memeriksa akun...</p>

    <section>
      <h2>Undangan Saya</h2>
      <p>Daftar undangan akan ditampilkan pada tahap berikutnya.</p>
    </section>

    <section>
      <h2>Paket Saya</h2>
      <p>Informasi langganan akan ditampilkan setelah integrasi data.</p>
    </section>

    <button id="logoutButton" type="button">Keluar</button>
  </main>

  <script type="module">
    import { requireRole, setupLogout } from "/assets/js/auth-guard.js";

    setupLogout();

    const result = await requireRole(["customer"]);

    if (result) {
      const name = result.profile.full_name || result.user.email || "Pelanggan";
      document.getElementById("welcomeMessage").textContent =
        `Selamat datang, ${name}!`;
    }
  </script>
</body>
</html>
