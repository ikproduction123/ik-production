<!doctype html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Reset password akun IK-Pro.My.Id"
    >

    <title>Lupa Password - IK-Pro.My.Id</title>

    <link
        rel="icon"
        type="image/x-icon"
        href="/favicon.ico"
    >

    <link
        rel="stylesheet"
        href="/assets/css/auth.css"
    >

    <!-- Supabase -->
    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
        defer
    ></script>
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-header">

                <h1>
                    Lupa Password?
                </h1>

                <p>
                    Masukkan email akun Anda untuk menerima
                    link reset password.
                </p>

            </div>


            <!-- ALERT -->

            <div
                id="auth-alert"
                class="auth-alert"
                role="alert"
                hidden
            ></div>


            <!-- FORM -->

            <form
                id="forgot-password-form"
                novalidate
            >

                <!-- EMAIL -->

                <div class="form-group">

                    <label
                        for="email"
                    >
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="nama@email.com"
                        autocomplete="email"
                        maxlength="254"
                        required
                    >

                    <small
                        id="email-error"
                        class="form-error"
                    ></small>

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    id="forgot-password-submit"
                >

                    <span id="forgot-password-submit-text">
                        Kirim Link Reset
                    </span>

                    <span
                        id="forgot-password-loading"
                        hidden
                    >
                        Mengirim...
                    </span>

                </button>

            </form>


            <!-- BACK TO LOGIN -->

            <div class="auth-footer">

                <a href="/login.html">
                    ← Kembali ke Login
                </a>

            </div>

        </section>

    </main>


    <!-- JS -->

    <script
        type="module"
        src="/assets/js/forgot-password.js"
    ></script>

</body>
</html>
