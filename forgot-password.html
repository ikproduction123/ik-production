<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa Kata Sandi - IK Production</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Lupa Kata Sandi</h2>
      <p>Masukkan email Anda untuk menerima link reset kata sandi</p>
    </div>
    <form id="forgot-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="nama@email.com" required>
      </div>
      <button type="submit" class="btn-primary btn-full" id="btn-forgot">Kirim Link Reset</button>
    </form>
    <p class="auth-footer">
      Kembali ke <a href="/login.html" class="auth-link">Masuk</a>
    </p>
  </div>
  <script type="module" src="/js/auth/reset-password.js"></script>
</body>
</html>
