<!doctype html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Buat password baru akun IK-Pro.My.Id"
    >

    <title>Reset Password - IK-Pro.My.Id</title>

    <link
        rel="icon"
        type="image/x-icon"
        href="/favicon.ico"
    >

    <link
        rel="stylesheet"
        href="/assets/css/auth.css"
    >

    <!-- Supabase -->
    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
        defer
    ></script>

</head>


<body>

    <main class="auth-page">

        <section class="auth-card">

            <!-- HEADER -->

            <div class="auth-header">

                <h1>
                    Buat Password Baru
                </h1>

                <p>
                    Masukkan password baru untuk
                    mengamankan akun Anda.
                </p>

            </div>


            <!-- ALERT -->

            <div
                id="auth-alert"
                class="auth-alert"
                role="alert"
                hidden
            ></div>


            <!-- FORM -->

            <form
                id="reset-password-form"
                novalidate
            >

                <!-- PASSWORD BARU -->

                <div class="form-group">

                    <label for="password">
                        Password Baru
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Minimal 8 karakter"
                            autocomplete="new-password"
                            minlength="8"
                            maxlength="72"
                            required
                        >

                        <button
                            type="button"
                            id="toggle-password"
                            aria-label="Tampilkan password"
                            aria-pressed="false"
                        >
                            👁
                        </button>

                    </div>

                    <small
                        id="password-error"
                        class="form-error"
                    ></small>

                </div>


                <!-- KONFIRMASI PASSWORD -->

                <div class="form-group">

                    <label for="confirm-password">
                        Konfirmasi Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm-password"
                            placeholder="Ulangi password baru"
                            autocomplete="new-password"
                            minlength="8"
                            maxlength="72"
                            required
                        >

                        <button
                            type="button"
                            id="toggle-confirm-password"
                            aria-label="Tampilkan password"
                            aria-pressed="false"
                        >
                            👁
                        </button>

                    </div>

                    <small
                        id="confirm-password-error"
                        class="form-error"
                    ></small>

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    id="reset-password-submit"
                >

                    <span id="reset-password-submit-text">
                        Simpan Password Baru
                    </span>

                    <span
                        id="reset-password-loading"
                        hidden
                    >
                        Menyimpan...
                    </span>

                </button>

            </form>


            <!-- FOOTER -->

            <div class="auth-footer">

                <a href="/login.html">
                    ← Kembali ke Login
                </a>

            </div>

        </section>

    </main>


    <!-- JS -->

    <script
        type="module"
        src="/assets/js/reset-password.js"
    ></script>

</body>

</html>
