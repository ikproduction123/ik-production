<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Kata Sandi - IK Production</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Kata Sandi Baru</h2>
      <p>Buat kata sandi baru untuk akun Anda</p>
    </div>
    <form id="reset-form">
      <div class="form-group">
        <label for="new-password">Kata Sandi Baru</label>
        <input type="password" id="new-password" placeholder="••••••••" minlength="6" required>
      </div>
      <button type="submit" class="btn-primary btn-full" id="btn-reset">Simpan Kata Sandi</button>
    </form>
  </div>
  <script type="module" src="/js/auth/reset-password.js"></script>
</body>
</html>
